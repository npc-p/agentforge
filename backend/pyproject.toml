[project]
name = "agentforge-backend"
version = "0.1.0"
description = "AgentForge - 智能体研发平台（Agent 编排 + RAG + 工具调用 + 数据流水线 + 评测）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiomysql>=0.2.0",
    "pymysql>=1.1.1",
    "cryptography>=43.0.0",
    "alembic>=1.14.0",
    "httpx>=0.27.2",
    "sse-starlette>=2.1.3",
    "python-multipart>=0.0.12",
    "chromadb>=0.5.20",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "orjson>=3.10.11",
]

[project.optional-dependencies]
# 本地 BGE-M3 向量化所需。故意不放进主依赖：torch 体积大，
# 只想用轻量 hashing 向量或远程 embeddings 的场景不必承担。
# 安装：uv pip install -p .venv/Scripts/python.exe -e ".[local-embed]"
local-embed = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "anyio>=4.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
